<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Classroom Attendance Tracker</title>
    
    <!-- Import Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #86ebc9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #9e6060;
        }

        .chart-container {
            width: 80%;
            max-width: 700px;
            height: 400px;
            margin: 30px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <h2>Real-Time Classroom Attendance</h2>

    <div class="chart-container">
        <canvas id="attendanceChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('attendanceChart').getContext('2d');

        // Create initial empty Chart object
        const attendanceChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [], 
                datasets: [{
                    label: 'Students Present',
                    data: [],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true, // Y-axis starts from zero
                        suggestedMax: 40 // Assuming max class capacity is around 40
                    }
                }
            }
        });

        // Function to generate a random attendance count (e.g., between 20 and 38 students)
        function getRandomAttendance() {
            return Math.floor(Math.random() * (38 - 20 + 1)) + 20;
        }

        function getCurrentTimeString() {
            const now = new Date();
            return now.toTimeString().split(' ')[0];
        }

        function updateAttendanceData() {
            const timeLabel = getCurrentTimeString();
            const newAttendanceValue = getRandomAttendance();

            attendanceChart.data.labels.push(timeLabel);
            attendanceChart.data.datasets[0].data.push(newAttendanceValue);

            if (attendanceChart.data.labels.length > 8) {
                attendanceChart.data.labels.shift();
                attendanceChart.data.datasets[0].data.shift();
            }

    
            attendanceChart.update();
        }

       
        updateAttendanceData();

        setInterval(updateAttendanceData, 3000);
    </script>

</body>
</html>
